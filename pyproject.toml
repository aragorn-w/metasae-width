[project]
name = "metasae-width"
version = "0.0.0"
description = "Meta-SAE agreement against dictionary width, with matched-noise twins, on the Gemma Scope 2 family."
requires-python = ">=3.15,<3.16"

dependencies = [
    "torch==2.15.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "safetensors==0.8.0",
    "huggingface-hub==2.4.0",
    "matplotlib==3.11.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
